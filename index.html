<script>
    const state = {
      currentPage: 1,
      canAdvance: true,
      ended: false,
      emojiTimerId: null,
      emojiStartTime: 0,
      emojiTickId: null,
    };

    const scrollWrapper = document.getElementById('scrollWrapper');
    const scrollPaper   = document.getElementById('scrollPaper');
    const scrollHint    = document.getElementById('scrollHint');
    const startContent  = document.getElementById('startContent');
    const gameContent   = document.getElementById('gameContent');
    const startBtn      = document.getElementById('startBtn');
    const footer        = document.getElementById('footer');
    const endingScreen  = document.getElementById('endingScreen');
    const endingName    = document.getElementById('endingName');
    const restartBtn    = document.getElementById('restartBtn');
    const temple        = document.getElementById('temple');

    /* ========= 滚动提示检测 ========= */
    function checkScrollable() {
      requestAnimationFrame(() => {
        const hasMore = scrollPaper.scrollHeight - scrollPaper.scrollTop - scrollPaper.clientHeight > 12;
        if (hasMore) {
          scrollHint.classList.add('visible');
        } else {
          scrollHint.classList.remove('visible');
        }
      });
    }

    scrollPaper.addEventListener('scroll', () => {
      const hasMore = scrollPaper.scrollHeight - scrollPaper.scrollTop - scrollPaper.clientHeight > 12;
      if (hasMore) {
        scrollHint.classList.add('visible');
      } else {
        scrollHint.classList.remove('visible');
      }
    }, { passive: true });

    /* ========= 页面切换 ========= */
    function showPage(n) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const target = document.querySelector(`.page[data-page="${n}"]`);
      if (target) {
        target.classList.add('active');
        state.currentPage = n;
        // 2、6 页不能推进；7、8 页靠「▼ 尾声」触发结局
        state.canAdvance = !(n === 2 || n === 6 || n === 7 || n === 8);
        scrollPaper.scrollTop = 0;
        setTimeout(checkScrollable, 80);
        setTimeout(checkScrollable, 400);

        if (n === 6) {
          setTimeout(startEmojiGame, 400);
        }
      }
    }

    function advance() {
      if (state.ended) return;
      if (!state.canAdvance) return;
      const next = state.currentPage + 1;
      if (next <= 8) showPage(next);
    }

    /* ========= 开始游戏 ========= */
    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      scrollWrapper.classList.add('expanded');
      startContent.style.opacity = '0';
      setTimeout(() => {
        startContent.style.display = 'none';
        gameContent.classList.add('visible');
        footer.style.opacity = '0.3';
        showPage(1);
      }, 400);
    });

    /* ========= 点击纸卷 —— 只响应「▼ 续」和「▼ 尾声」 ========= */
    scrollPaper.addEventListener('click', (e) => {
      if (state.ended) return;

      // 选项按钮、emoji 不归这里管
      if (e.target.closest('.choice-btn')) return;
      if (e.target.closest('.float-emoji')) return;

      // 只有点到 continue-hint 才处理
      const hint = e.target.closest('.continue-hint');
      if (!hint) return; // 点其他任何位置都不做任何事

      const ed = hint.dataset.ending;
      if (ed) {
        showEnding(ed);
        return;
      }
      advance();
    });

    /* ========= 选项按钮 ========= */
    document.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const next = parseInt(btn.dataset.next, 10);
        showPage(next);
      });
    });

    /* ========= Emoji 游戏 ========= */
    const ALL_EMOJIS = ['🎞️','🪙','⚖️','🪜','🪤','🪞','🗝️','🪩','📜','🏷️','🗃️','📝'];
    const GAME_DURATION = 5000;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startEmojiGame() {
      const area = document.getElementById('emojiArea');
      const timerEl = document.getElementById('emojiTimer');
      area.querySelectorAll('.float-emoji').forEach(el => el.remove());

      const chosen = shuffle(ALL_EMOJIS).slice(0, 8);
      let clicked = 0;
      let finished = false;

      const areaRect = area.getBoundingClientRect();
      const W = areaRect.width;
      const H = areaRect.height;

      chosen.forEach((emoji, i) => {
        const el = document.createElement('span');
        el.className = 'float-emoji';
        el.textContent = emoji;

        const cols = 4, rows = 2;
        const col = i % cols;
        const row = Math.floor(i / cols);
        const cellW = W / cols;
        const cellH = H / rows;
        const pad = 30;
        const maxLeft = Math.max(0, cellW - pad * 2 - 40);
        const maxTop  = Math.max(0, cellH - pad * 2 - 40);
        const left = col * cellW + pad + Math.random() * maxLeft;
        const top  = row * cellH + pad + Math.random() * maxTop;

        el.style.left = left + 'px';
        el.style.top  = top + 'px';
        el.style.animationDelay = (Math.random() * 1.5) + 's';
        el.style.animationDuration = (2 + Math.random() * 1.5) + 's';

        const handleHit = (ev) => {
          ev.stopPropagation();
          if (finished || el.classList.contains('gone')) return;
          el.classList.add('gone');
          clicked++;
          if (clicked >= 8) {
            finished = true;
            clearTimeout(state.emojiTimerId);
            clearInterval(state.emojiTickId);
            timerEl.textContent = '0.0s';
            setTimeout(() => showPage(7), 500);
          }
        };

        el.addEventListener('click', handleHit);
        el.addEventListener('touchstart', handleHit, { passive: true });

        area.appendChild(el);
      });

      state.emojiStartTime = Date.now();
      timerEl.textContent = '5.0s';
      state.emojiTickId = setInterval(() => {
        const elapsed = Date.now() - state.emojiStartTime;
        const remaining = Math.max(0, (GAME_DURATION - elapsed) / 1000);
        timerEl.textContent = remaining.toFixed(1) + 's';
      }, 100);

      state.emojiTimerId = setTimeout(() => {
        if (finished) return;
        finished = true;
        clearInterval(state.emojiTickId);
        showPage(8);
      }, GAME_DURATION);
    }

    /* ========= 结局 ========= */
    function showEnding(which) {
      if (state.ended) return;
      state.ended = true;
      state.canAdvance = false;

      const name = which === '1'
        ? '在他的庭院中'
        : '无论如何是时候死亡回归了';

      scrollWrapper.classList.add('gone');
      footer.style.opacity = '0';
      scrollHint.classList.remove('visible');

      endingName.textContent = name;
      endingScreen.classList.add('visible');
      setTimeout(() => {
        endingName.classList.add('fade-in');
      }, 400);
      setTimeout(() => {
        restartBtn.classList.add('visible');
      }, 3000);
    }

    /* ========= 重新开始 ========= */
    restartBtn.addEventListener('click', () => {
      endingScreen.classList.remove('visible');
      endingName.classList.remove('fade-in');
      restartBtn.classList.remove('visible');
      endingName.textContent = '';

      state.ended = false;
      state.canAdvance = true;
      state.currentPage = 1;

      scrollWrapper.classList.remove('gone');
      scrollWrapper.classList.remove('expanded');
      footer.style.opacity = '';
      scrollHint.classList.remove('visible');

      startContent.style.display = '';
      startContent.style.opacity = '1';
      gameContent.classList.remove('visible');
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelector('.page[data-page="1"]').classList.add('active');
      scrollPaper.scrollTop = 0;
    });

</script>
